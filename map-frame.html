<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartPath atlas</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{height:100%;width:100%;margin:0}body{font:14px system-ui;background:#dce9ec}#map{position:absolute;inset:0}.leaflet-container{font:inherit}.leaflet-popup-content{line-height:1.5}.leaflet-popup-content a{color:#007f89}#error{display:none;position:absolute;inset:0;align-items:center;justify-content:center;text-align:center;padding:20px;background:#e7f1f3;color:#163945;z-index:1000}</style></head><body><div id="map"></div><div id="error">Map unavailable. Location information is available in the cards below.</div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
(()=>{'use strict';if(!window.L){document.getElementById('error').style.display='flex';return}
const map=L.map('map',{scrollWheelZoom:false,preferCanvas:true}).setView([-15,23],4);
const street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19});
const satellite=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'© Esri',maxZoom:19});
const topo=L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{attribution:'© OpenTopoMap',maxZoom:17});
street.addTo(map);L.control.layers({'Street map':street,'Satellite':satellite,'Topographic':topo},null,{collapsed:true}).addTo(map);
const colors={completed:'#00a4ac',planned:'#ff695c',exploratory:'#577b8c',origin:'#00a4ac'};let markers=[],active='all';
function apply(){let points=[];for(const o of markers){if(active==='all'||active===o.status){o.marker.addTo(map);points.push(o.marker.getLatLng())}else map.removeLayer(o.marker)}if(points.length)map.fitBounds(L.latLngBounds(points).pad(.2),{maxZoom:active==='all'?5:8,animate:false})}
function render(items){markers.forEach(o=>map.removeLayer(o.marker));markers=[];for(const o of items){const lat=Number(o.lat),lon=Number(o.lon);if(!Number.isFinite(lat)||!Number.isFinite(lon))continue;const status=colors[o.status]?o.status:'exploratory';const marker=L.circleMarker([lat,lon],{radius:9,weight:2,color:'#fff',fillColor:colors[status],fillOpacity:1});const node=document.createElement('div'),title=document.createElement('strong'),link=document.createElement('a');title.textContent=o.title;link.href='#';link.textContent='View location details';link.addEventListener('click',e=>{e.preventDefault();parent.postMessage({source:'smartpath-atlas',type:'focus',id:o.id},location.origin)});node.append(title,document.createElement('br'),status,document.createElement('br'),link);marker.bindPopup(node);markers.push({marker,status})}apply();setTimeout(()=>map.invalidateSize(true),100)}
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.data?.source!=='smartpath-atlas')return;if(e.data.type==='locations'){active=e.data.filter||'all';render(e.data.locations||[])}if(e.data.type==='filter'){active=e.data.filter||'all';apply()}});
parent.postMessage({source:'smartpath-atlas',type:'ready'},location.origin);window.addEventListener('resize',()=>map.invalidateSize(true));
})();
</script></body></html>
